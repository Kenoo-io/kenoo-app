[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kenoo-systems"
version = "0.1.0"
description = "Kenoo long-running workers — people enrichment and future systems"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34.0,<2",
    "httpx>=0.27.0,<1",
    "python-dotenv>=1.0.0,<2",
    "supabase>=2.10.0,<3",
    "trafilatura>=1.9.0,<2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
]

[project.scripts]
people-enrichment = "people_enrichment.main:run_loop"

[tool.setuptools.packages.find]
where = ["."]
include = ["shared*", "people_enrichment*"]

[tool.ruff]
line-length = 100
target-version = "py311"
