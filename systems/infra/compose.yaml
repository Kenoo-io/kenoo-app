services:
  people-enrichment:
    build:
      context: ../..
      dockerfile: systems/infra/Dockerfile
      args:
        SYSTEM_NAME: people_enrichment
    env_file:
      - path: ../../.env.local
        required: false
      - path: ../../.env
        required: false
    environment:
      POLL_INTERVAL_SECONDS: "10"
    restart: unless-stopped
