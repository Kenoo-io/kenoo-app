name: Deploy Kenoo MCP

on:
  push:
    branches: [main]
    paths:
      - "apps/mcp/**"
      - ".github/workflows/deploy-mcp.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-kenoo-mcp-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show OIDC identity claims
        run: |
          token="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | jq -r '.value')"
          payload="$(TOKEN="$token" node -e 'process.stdout.write(Buffer.from(process.env.TOKEN.split(".")[1], "base64url").toString("utf8"))')"
          printf '%s' "$payload" | jq '{aud, sub, repository, ref, environment, job_workflow_ref}'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-2

      - name: Set up AWS SAM
        uses: aws-actions/setup-sam@v3
        with:
          use-installer: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build MCP image
        run: sam build --template-file apps/mcp/infrastructure/template.yaml

      - name: Deploy MCP stack
        env:
          MCP_DOMAIN_NAME: ${{ vars.MCP_DOMAIN_NAME }}
          MCP_HOSTED_ZONE_ID: ${{ vars.MCP_HOSTED_ZONE_ID }}
          MCP_CERTIFICATE_ARN: ${{ vars.MCP_CERTIFICATE_ARN }}
          MCP_SUPABASE_URL: ${{ secrets.MCP_SUPABASE_URL }}
          MCP_SUPABASE_ANON_KEY: ${{ secrets.MCP_SUPABASE_ANON_KEY }}
        run: |
          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --stack-name kenoo-mcp \
            --resolve-image-repos \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              McpDomainName="$MCP_DOMAIN_NAME" \
              McpHostedZoneId="$MCP_HOSTED_ZONE_ID" \
              McpCertificateArn="$MCP_CERTIFICATE_ARN" \
              SupabaseUrl="$MCP_SUPABASE_URL" \
              SupabaseAnonKey="$MCP_SUPABASE_ANON_KEY"
