name: Deploy Kenoo MCP

on:
  push:
    branches: [main]
    paths:
      - "apps/mcp/**"
      - ".github/workflows/deploy-mcp.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-kenoo-mcp-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-2

      - name: Enable ARM image builds
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up AWS SAM
        uses: aws-actions/setup-sam@v3
        with:
          use-installer: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build MCP image
        run: sam build --template-file apps/mcp/infrastructure/template.yaml

      - name: Deploy MCP stack
        env:
          MCP_DOMAIN_NAME: ${{ vars.MCP_DOMAIN_NAME }}
          MCP_CERTIFICATE_ARN: ${{ vars.MCP_CERTIFICATE_ARN }}
          MCP_SUPABASE_URL: ${{ secrets.MCP_SUPABASE_URL }}
          MCP_SUPABASE_ANON_KEY: ${{ secrets.MCP_SUPABASE_ANON_KEY }}
        run: |
          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --stack-name kenoo-mcp \
            --resolve-image-repos \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              McpDomainName="$MCP_DOMAIN_NAME" \
              McpCertificateArn="$MCP_CERTIFICATE_ARN" \
              SupabaseUrl="$MCP_SUPABASE_URL" \
              SupabaseAnonKey="$MCP_SUPABASE_ANON_KEY"
