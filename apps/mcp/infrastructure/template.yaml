AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Kenoo MCP — stateless Streamable HTTP endpoint on AWS Lambda.

Parameters:
  SupabaseUrl:
    Type: String
    Description: Kenoo Supabase project URL.
  SupabaseAnonKey:
    Type: String
    NoEcho: true
    Description: Kenoo Supabase anonymous key. The service-role key is intentionally never used here.

Globals:
  Function:
    Architectures: [arm64]
    MemorySize: 512
    Timeout: 28
    Tracing: Active

Resources:
  KenooMcpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: "$default"

  KenooMcp:
    Type: AWS::Serverless::Function
    Metadata:
      DockerContext: ../../..
      Dockerfile: apps/mcp/Dockerfile
      DockerTag: kenoo-mcp
    Properties:
      PackageType: Image
      Events:
        Mcp:
          Type: HttpApi
          Properties:
            ApiId: !Ref KenooMcpApi
            Path: /mcp
            Method: POST
        McpStream:
          Type: HttpApi
          Properties:
            ApiId: !Ref KenooMcpApi
            Path: /mcp
            Method: GET
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref KenooMcpApi
            Path: /health
            Method: GET
      Environment:
        Variables:
          NEXT_PUBLIC_SUPABASE_URL: !Ref SupabaseUrl
          NEXT_PUBLIC_SUPABASE_ANON_KEY: !Ref SupabaseAnonKey

Outputs:
  McpEndpoint:
    Description: Public MCP endpoint. Put this behind mcp.kenoo.com after OAuth is configured.
    Value: !Sub "https://${KenooMcpApi}.execute-api.${AWS::Region}.amazonaws.com/mcp"
